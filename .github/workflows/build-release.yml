name: Build Release

on:
     push:
          tags:
             - 'v*'
     workflow_dispatch:

concurrency:
     group: release-${{ github.ref }}
     cancel-in-progress: false

permissions:
     contents: write

jobs:
     build_release:
          runs-on: ubuntu-latest
          timeout-minutes: 30

          steps:
             - uses: actions/checkout@v4

             - name: Setup Bun
               uses: oven-sh/setup-bun@v2
               with:
                    bun-version: '1'

             - name: Setup Go
               uses: actions/setup-go@v5
               with:
                    go-version: 'stable'
                    cache: true
                    cache-dependency-path: src/backend/go.sum

             - name: Set package version from release tag
               run: bun utils/set-package-version.ts --mode=release

             - name: Cache dependencies
               uses: actions/cache@v4
               with:
                    path: |
                         ~/.bun/install/cache
                         ~/.cache/electron
                         ~/.cache/electron-builder
                    key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock', 'package.json') }}
                    restore-keys: |
                         ${{ runner.os }}-deps-

             - name: Install system dependencies (Linux)
               run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      rpm libarchive-tools libgtk-3-dev libayatana-appindicator3-dev
               env:
                    DEBIAN_FRONTEND: noninteractive

             - name: Install dependencies
               run: bun install --frozen-lockfile

             - name: Build App
               run: bun run build:all
               env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

             - name: Zip linux-unpacked
               run: |
                    zip -r "dist/linux-wallpaperengine-gui.zip" dist/linux-unpacked

             - name: Upload Release Assets
               uses: softprops/action-gh-release@v2
               with:
                    generate_release_notes: true
                    files: |
                         dist/*.AppImage
                         dist/*.deb
                         dist/*.rpm
                         dist/*.zip
                         dist/latest-linux.yml
               env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

             - name: Read published release date
               if: startsWith(github.ref, 'refs/tags/v')
               env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
               run: |
                    release_date="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.published_at | split("T")[0]')"
                    echo "RELEASE_DATE=${release_date}" >> "$GITHUB_ENV"

             - name: Update AppStream release history
               if: startsWith(github.ref, 'refs/tags/v')
               run: |
                    git fetch origin dev
                    git checkout -B dev origin/dev

                    bun utils/update-appstream-releases.ts \
                      --version "$GITHUB_REF_NAME" \
                      --date "$RELEASE_DATE"

                    metadata='packaging/io.github.AzPepoze.linux-wallpaperengine-gui.metainfo.xml'
                    if git diff --quiet -- "$metadata"; then
                      exit 0
                    fi

                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add "$metadata"
                    git commit -m "chore: update AppStream releases for ${GITHUB_REF_NAME}"
                    git pull --rebase origin dev
                    git push origin HEAD:dev
