name: Build Check

on:
     push:
          branches:
             - dev
     pull_request:
          branches:
             - dev

concurrency:
     group: check-${{ github.ref }}
     cancel-in-progress: true

permissions:
     contents: read

jobs:
     build_check:
          runs-on: ubuntu-latest
          timeout-minutes: 25

          steps:
             - uses: actions/checkout@v6

             - name: Setup Bun
               uses: oven-sh/setup-bun@v2
               with:
                    bun-version: '1'

             - name: Setup Go
               uses: actions/setup-go@v7
               with:
                    go-version: 'stable'
                    cache-dependency-path: src/backend/go.sum

             - name: Setup Xmake
               uses: xmake-io/github-action-setup-xmake@v1
               with:
                    xmake-version: latest

             - name: Cache Bun dependencies
               uses: actions/cache@v5
               with:
                    path: ~/.bun/install/cache
                    key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                    restore-keys: |
                         bun-${{ runner.os }}-

             - name: Install system dependencies (Linux)
               run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                      build-essential pkg-config \
                      qt6-base-dev qt6-webchannel-dev qt6-webengine-dev \
                      libgtk-3-dev libayatana-appindicator3-dev

             - name: Verify Qt 6 toolchain
               shell: bash
               run: |
                    set -euo pipefail
                    qt_version="$(qmake6 -query QT_VERSION)"
                    echo "Qt version: ${qt_version}"
                    [[ "${qt_version}" == 6.* ]]
                    xmake --version

             - name: Install golangci-lint
               run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

             - name: Install dependencies
               run: bun install --frozen-lockfile

             - name: Build shared-runtime application
               run: bun run build

             - name: Run checks
               run: bun run check

             - name: Verify browser runtime is not bundled
               shell: bash
               run: |
                    set -euo pipefail
                    test -x dist/linux-unpacked/bin/linux-wallpaperengine-gui
                    test -x dist/linux-unpacked/lib/linux-wallpaperengine-gui/linux-wallpaperengine-webview
                    test -f dist/linux-unpacked/share/linux-wallpaperengine-gui/frontend/index.html

                    if find dist/linux-unpacked -type f \( \
                      -iname 'electron' -o \
                      -iname 'electron-*' -o \
                      -iname 'QtWebEngineProcess' -o \
                      -iname 'libQt6WebEngine*.so*' -o \
                      -iname 'chrome-sandbox' -o \
                      -iname 'resources.pak' \
                    \) | grep -q .; then
                      echo 'Bundled browser/runtime files detected:'
                      find dist/linux-unpacked -type f \( \
                        -iname 'electron' -o \
                        -iname 'electron-*' -o \
                        -iname 'QtWebEngineProcess' -o \
                        -iname 'libQt6WebEngine*.so*' -o \
                        -iname 'chrome-sandbox' -o \
                        -iname 'resources.pak' \
                      \)
                      exit 1
                    fi
